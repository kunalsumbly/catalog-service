polar:
  greeting: Welcome to the local book catalog

spring:
  application:
    name: catalog-service
  cloud:
    config:
      request-connect-timeout: 5000
      request-read-timeout: 5000
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1
    bus:
      enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}          # Default to 'rabbitmq' if not set
    port: ${SPRING_RABBITMQ_PORT:5672}              # Default to 5672 if not set
    username: ${SPRING_RABBITMQ_USERNAME:guest}     # Default to 'guest' if not set
    password: ${SPRING_RABBITMQ_PASSWORD:guest}     # Default to 'guest' if not set
    ssl:
      enabled: true
      validate-server-certificate: false
      hostname-verification: false
    retry:
      initial-interval: 5000
      max-interval: 30000
      max-attempts: 10


management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info
server:
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 15s
    threads:
      max: 50
      min-spare: 5
