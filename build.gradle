plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

apply plugin: 'org.springframework.boot'

group = 'com.polarbookshop'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    set('springCloudVersion', "2023.0.5")
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.3.1'
    implementation group: 'org.apache.httpcomponents', name: 'httpcore', version: '4.4.16'

    // to make sure that if connectivity with config server is more resilient
    implementation('org.springframework.retry:spring-retry')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    // add lombok

    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    // jasypt
//    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'



    annotationProcessor('org.springframework.boot:spring-boot-configuration-processor')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
//    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
//    testImplementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
//    testImplementation 'org.springframework.cloud:spring-cloud-contract-stub-runner'

}

tasks.named('test') {
    useJUnitPlatform()
}

// how to use profile to generate data for bootRun
bootRun {
    systemProperty 'spring.profiles.active' , 'testData'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom 'software.amazon.awssdk:bom:2.20.84'
    }
}
