  polar-postgres-catalog:
    image: postgres:latest
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - ${USERDIR:-/tmp}/postgres_data:/var/lib/postgresql/data  # Persistent data storage
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - app-network

  adminer:
    image: adminer
    ports:
      - 9999:8080
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
